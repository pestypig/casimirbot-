<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="520" viewBox="0 0 1100 520" role="img" aria-labelledby="title desc">
  <title id="title">Preregistered timing and custody sequence</title>
  <desc id="desc">Pilot sequence from apparatus characterization through blinded hold and conditional unblinding.</desc>
  <defs><marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0 0L9 3 0 6Z" fill="#334155"/></marker><style>text{font-family:Inter,Arial,sans-serif;fill:#172033}.h{font-size:26px;font-weight:700}.l{font-size:17px;font-weight:700}.s{font-size:14px}.b{stroke:#334155;stroke-width:2;rx:12}</style></defs>
  <rect width="1100" height="520" fill="white"/><text x="45" y="50" class="h">Pilot and confirmatory timing logic</text>
  <line x1="85" y1="245" x2="1020" y2="245" stroke="#334155" stroke-width="3" marker-end="url(#a)"/>
  <g transform="translate(55 100)"><rect width="150" height="105" class="b" fill="#e0f2fe"/><text x="18" y="34" class="l">Characterize</text><text x="18" y="61" class="s">mass, response,</text><text x="18" y="82" class="s">settling, noise</text></g>
  <g transform="translate(225 100)"><rect width="150" height="105" class="b" fill="#dcfce7"/><text x="18" y="34" class="l">Prepare</text><text x="18" y="61" class="s">branch fidelity</text><text x="18" y="82" class="s">and separation</text></g>
  <g transform="translate(395 100)"><rect width="150" height="105" class="b" fill="#fef3c7"/><text x="18" y="34" class="l">Randomize</text><text x="18" y="61" class="s">active, reference,</text><text x="18" y="82" class="s">sham, detuned</text></g>
  <g transform="translate(565 100)"><rect width="150" height="105" class="b" fill="#ede9fe"/><text x="18" y="34" class="l">Blind hold</text><text x="18" y="61" class="s">time grid with</text><text x="18" y="82" class="s">echo/path swap</text></g>
  <g transform="translate(735 100)"><rect width="150" height="105" class="b" fill="#cffafe"/><text x="18" y="34" class="l">Read out</text><text x="18" y="61" class="s">complex C plus</text><text x="18" y="82" class="s">all witnesses</text></g>
  <g transform="translate(905 100)"><rect width="150" height="105" class="b" fill="#fee2e2"/><text x="18" y="34" class="l">Freeze</text><text x="18" y="61" class="s">exclusions and</text><text x="18" y="82" class="s">covariance</text></g>
  <line x1="130" y1="280" x2="130" y2="335" stroke="#64748b" stroke-width="2"/><line x1="980" y1="280" x2="980" y2="335" stroke="#64748b" stroke-width="2"/>
  <rect x="120" y="335" width="870" height="90" rx="14" fill="#f8fafc" stroke="#94a3b8" stroke-width="2"/>
  <text x="150" y="368" class="l">Unblind only if all gates pass</text>
  <text x="150" y="398" class="s">preparation ∧ measured responses ∧ covariance robustness ∧ identifiability ∧ power ∧ custody</text>
  <text x="45" y="478" class="s">A fixed “0.5 Hz” label does not determine settling. Static randomized cells are the default until the measured transfer function authorizes a cadence.</text>
</svg>
