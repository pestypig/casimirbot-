<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="520" viewBox="0 0 1100 520" role="img" aria-labelledby="title desc">
  <title id="title">External bound screening</title><desc id="desc">Logarithmic R0 axis with the XENONnT lower bound and selected point.</desc>
  <style>text{font-family:Inter,Arial,sans-serif;fill:#172033}.h{font-size:26px;font-weight:700}.l{font-size:18px;font-weight:700}.s{font-size:14px}</style>
  <rect width="1100" height="520" fill="white"/><text x="45" y="50" class="h">Regularization-length screening (model mapping still required)</text>
  <rect x="105" y="150" width="865" height="90" rx="12" fill="#f8fafc" stroke="#94a3b8" stroke-width="2"/>
  <rect x="105" y="150" width="368" height="90" rx="12" fill="#fee2e2" opacity=".9"/>
  <line x1="105" y1="260" x2="970" y2="260" stroke="#334155" stroke-width="3"/>
  <g class="s" text-anchor="middle">
    <line x1="105" y1="250" x2="105" y2="270" stroke="#334155"/><text x="105" y="295">10⁻¹² m</text>
    <line x1="321" y1="250" x2="321" y2="270" stroke="#334155"/><text x="321" y="295">10⁻¹⁰ m</text>
    <line x1="537" y1="250" x2="537" y2="270" stroke="#334155"/><text x="537" y="295">10⁻⁸ m</text>
    <line x1="753" y1="250" x2="753" y2="270" stroke="#334155"/><text x="753" y="295">10⁻⁶ m</text>
    <line x1="970" y1="250" x2="970" y2="270" stroke="#334155"/><text x="970" y="295">10⁻⁴ m</text>
  </g>
  <line x1="473" y1="125" x2="473" y2="275" stroke="#e11d48" stroke-width="4"/><circle cx="473" cy="195" r="10" fill="#e11d48"/>
  <text x="345" y="108" class="l">XENONnT 90% lower bound</text><text x="405" y="132" class="s">R₀ &gt; 4.9×10⁻¹⁰ m</text>
  <line x1="645" y1="125" x2="645" y2="275" stroke="#2563eb" stroke-width="4"/><circle cx="645" cy="195" r="12" fill="#2563eb"/>
  <text x="675" y="112" class="l">Selected point</text><text x="675" y="137" class="s">R₀ = 1.0×10⁻⁷ m</text>
  <text x="135" y="205" class="s" fill="#9f1239">excluded by this one-sided screen</text>
  <rect x="550" y="335" width="360" height="70" rx="12" fill="#dbeafe" stroke="#2563eb" stroke-width="2" stroke-dasharray="8 5"/>
  <text x="575" y="365" class="l">Conditional apparatus point</text><text x="575" y="389" class="s">not a measured exclusion region</text>
  <text x="45" y="465" class="s">The axis comparison is numerical only until the Gaussian convention, normalization, composite-particle mapping, and radiation response are matched.</text>
</svg>
