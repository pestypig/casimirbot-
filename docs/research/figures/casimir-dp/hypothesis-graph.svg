<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="610" viewBox="0 0 1100 610" role="img" aria-labelledby="title desc">
  <title id="title">Hypothesis separation</title><desc id="desc">Three hypotheses and their claim ceilings.</desc>
  <defs><marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0 0L9 3 0 6Z" fill="#334155"/></marker><style>text{font-family:Inter,Arial,sans-serif;fill:#172033}.h{font-size:26px;font-weight:700}.l{font-size:18px;font-weight:700}.s{font-size:14px}.box{stroke-width:2;rx:14}</style></defs>
  <rect width="1100" height="610" fill="white"/><text x="45" y="50" class="h">Three hypotheses; no silent bridge</text>
  <rect x="45" y="100" width="300" height="205" class="box" fill="#e0f2fe" stroke="#0284c7"/>
  <text x="70" y="140" class="l">H₀: ordinary physics</text><text x="70" y="174" class="s">thermal • gas • vibration</text><text x="70" y="200" class="s">patch/charge • optical readout</text><text x="70" y="226" class="s">finite-geometry Casimir/QED</text><text x="70" y="270" class="s" font-weight="700">Empirical nuisance model</text>
  <rect x="400" y="100" width="300" height="205" class="box" fill="#dcfce7" stroke="#16a34a"/>
  <text x="425" y="140" class="l">Hᴅ: frozen Diósi model</text><text x="425" y="174" class="s">single effective Gaussian particle</text><text x="425" y="200" class="s">R₀ = 100 nm • Γ = Eᴳ/ℏ</text><text x="425" y="226" class="s">no boundary variable in generator</text><text x="425" y="270" class="s" font-weight="700">Executable conditional prediction</text>
  <rect x="755" y="100" width="300" height="205" class="box" fill="#fef3c7" stroke="#d97706"/>
  <text x="780" y="140" class="l">Hʙ: boundary extension</text><text x="780" y="174" class="s">Casimir-conditioned collapse</text><text x="780" y="200" class="s">requires sourced transfer kernel</text><text x="780" y="226" class="s">requires a new preregistration</text><text x="780" y="270" class="s" font-weight="700">Not currently executable</text>
  <line x1="345" y1="200" x2="395" y2="200" stroke="#334155" stroke-width="2" marker-end="url(#a)"/><text x="350" y="184" class="s">test</text>
  <line x1="700" y1="200" x2="750" y2="200" stroke="#e11d48" stroke-width="3" stroke-dasharray="8 6"/>
  <text x="684" y="180" class="s" fill="#be123c">no kernel</text>
  <rect x="100" y="365" width="900" height="125" rx="16" fill="#fff1f2" stroke="#e11d48" stroke-width="2"/>
  <text x="130" y="405" class="l">A boundary-correlated residual first challenges H₀.</text>
  <text x="130" y="438" class="s">It does not become evidence for Hʙ merely because Casimir energy, mass energy, and collapse energy share units.</text>
  <text x="130" y="466" class="s">Manifold dynamics require a covariant source, complete stress-energy, a metric response, and a causal observable.</text>
  <text x="45" y="560" class="s">Penrose OR motivates the question but does not uniquely supply Hᴅ or Hʙ.</text>
</svg>
