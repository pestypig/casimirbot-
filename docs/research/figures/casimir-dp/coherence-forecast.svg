<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="500" viewBox="0 0 1100 620" role="img" aria-labelledby="title desc">
  <title id="title">Conditional Diósi-only coherence forecast</title><desc id="desc">Reference and sensitivity-grid visibility loss versus hold time.</desc>
  <style>text{font-family:Inter,Arial,sans-serif;fill:#172033}.h{font-size:26px;font-weight:700}.l{font-size:17px;font-weight:700}.s{font-size:14px}</style>
  <rect width="1100" height="620" fill="white"/><text x="45" y="50" class="h">Conditional model-only visibility loss</text>
  <line x1="115" y1="500" x2="1000" y2="500" stroke="#334155" stroke-width="3"/><line x1="115" y1="105" x2="115" y2="500" stroke="#334155" stroke-width="3"/>
  <g class="s" text-anchor="middle"><text x="115" y="530">0</text><text x="336" y="530">0.10</text><text x="557" y="530">0.20</text><text x="778" y="530">0.30</text><text x="1000" y="530">0.40 s</text></g>
  <g class="s" text-anchor="end"><text x="100" y="505">0%</text><text x="100" y="406">1.5%</text><text x="100" y="307">3%</text><text x="100" y="208">4.5%</text><text x="100" y="109">6%</text></g>
  <g stroke="#cbd5e1" stroke-width="1"><line x1="115" y1="401" x2="1000" y2="401"/><line x1="115" y1="302" x2="1000" y2="302"/><line x1="115" y1="203" x2="1000" y2="203"/><line x1="115" y1="104" x2="1000" y2="104"/></g>
  <polyline points="115,500 336,484 557,468 668,461 778,453 1000,437" fill="none" stroke="#2563eb" stroke-width="5"/>
  <polyline points="115,500 336,412 557,324 668,281 778,238 1000,153" fill="none" stroke="#d97706" stroke-width="5" stroke-dasharray="10 7"/>
  <circle cx="668" cy="461" r="9" fill="#2563eb"/><circle cx="668" cy="281" r="9" fill="#d97706"/>
  <text x="700" y="451" class="l" fill="#1d4ed8">reference: 0.598% at 250 ms</text>
  <text x="700" y="275" class="l" fill="#b45309">grid cell: 3.32% at 250 ms</text>
  <rect x="680" y="250" width="300" height="100" rx="12" fill="#f8fafc" stroke="#94a3b8"/>
  <line x1="705" y1="280" x2="760" y2="280" stroke="#2563eb" stroke-width="5"/><text x="780" y="286" class="s">authoritative apparatus</text>
  <line x1="705" y1="320" x2="760" y2="320" stroke="#d97706" stroke-width="5" stroke-dasharray="10 7"/><text x="780" y="326" class="s">sensitivity-only point</text>
  <text x="45" y="580" class="s">Curves show only exp(−ΓDt). Ordinary decoherence, uncertainty bands, and measured response are intentionally absent.</text>
</svg>
